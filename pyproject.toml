[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migrate-safe"
version = "0.1.0"
description = "Migration safety linter for Drizzle ORM — detect unsafe SQL patterns before they break rolling deployments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yunare Maia", email = "yunare@gmail.com" }]
keywords = ["drizzle", "orm", "migration", "sql", "safety", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
]
dependencies = ["click>=8.0", "rich>=13.0"]

[project.scripts]
migrate-safe = "migrate_safe.cli:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/migrate-safe"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
