[project]
name = "migrate-safe"
version = "0.1.0"
description = "Migration safety linter for Drizzle ORM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yunare Maia", email = "yunare@gmail.com"}]
dependencies = [
    "sqlparse>=0.5.0",
    "click>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
migrate-safe = "migrate_safe.cli:check"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migrate_safe"]
