name: 'migrate-safe'
description: 'Migration safety linter for Drizzle ORM — detect unsafe SQL patterns before they break rolling deployments'
author: 'Yunare Maia'

branding:
  icon: 'database'
  color: 'red'

inputs:
  path:
    description: 'Path to migration file or directory'
    required: false
    default: './drizzle/migrations'
  strict:
    description: 'Fail on WARNING findings (not just UNSAFE/CRITICAL)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install migrate-safe
      shell: bash
      env:
        # migrate-safe is not published on PyPI, so pip cannot resolve the bare
        # name (PyPI returns 404). Install from git instead, pinned to the ref
        # this action was referenced by so the CLI always matches the action
        # version. Falls back to the default branch for local `uses: ./` usage.
        MIGRATE_SAFE_REF: ${{ github.action_ref }}
      run: |
        pip install "git+https://github.com/yunaremaia/migrate-safe.git@${MIGRATE_SAFE_REF:-master}"

    - name: Run migrate-safe check
      shell: bash
      run: |
        if [ "${{ inputs.strict }}" = "true" ]; then
          migrate-safe check --strict "${{ inputs.path }}"
        else
          migrate-safe check "${{ inputs.path }}"
        fi
