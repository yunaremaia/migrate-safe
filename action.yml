name: 'migrate-safe'
description: 'Migration safety linter for Drizzle ORM — detect unsafe SQL patterns before they break rolling deployments'
author: 'Yunare Maia'

branding:
  icon: 'database'
  color: 'red'

inputs:
  path:
    description: 'Path to migration file or directory'
    required: false
    default: './drizzle/migrations'
  strict:
    description: 'Fail on WARNING findings (not just UNSAFE/CRITICAL)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install migrate-safe
      shell: bash
      run: pip install migrate-safe

    - name: Run migrate-safe check
      shell: bash
      run: |
        if [ "${{ inputs.strict }}" = "true" ]; then
          migrate-safe check --strict "${{ inputs.path }}"
        else
          migrate-safe check "${{ inputs.path }}"
        fi
